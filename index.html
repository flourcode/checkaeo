<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idea Sifter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5f46'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23dfff3f' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    /* ---------- Tokens: neutral layers, one accent ramp, semantic colours ---------- */
    :root{
      --bg:#f5f5f2; --surface:#fff; --frame:#efefea; --hover:#f8f8f5;
      --line:#e3e3dd; --line-2:#d3d3cc;
      --ink:#161616; --ink-2:#3a3a37; --ink-3:#6d6d67;
      --g-50:#eaf3ef; --g-100:#d3e7de; --g-600:#0b5f46; --g-700:#084a37;
      --lime:#dfff3f;                     /* reserved for the one top pick */
      --amber:#8a5300; --amber-bg:#fdf3e3; --red:#9b2c2c; --red-bg:#fbeaea;
      --r:12px; --r-lg:16px;
      --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px -16px rgba(0,0,0,.18);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    *{box-sizing:border-box}
    [hidden]{display:none !important}
    body{margin:0;background:var(--bg);color:var(--ink-2);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
    button,select{font:inherit;color:inherit}
    a{color:var(--g-600)}
    :focus-visible{outline:2px solid var(--g-600);outline-offset:2px;border-radius:6px}
    .wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* ---------- Toolbar ---------- */
    .bar{position:sticky;top:0;z-index:5;background:rgba(245,245,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 20px;padding:12px 20px}
    .bar__in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
    .brand{display:flex;flex-direction:column;margin-right:auto}
    .brand h1{margin:0;font-size:18px;line-height:1.2;letter-spacing:-.02em;color:var(--ink)}
    .brand span{font-size:12px;color:var(--ink-3)}
    .tools{display:flex;align-items:center;gap:8px}
    .count{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
    select{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 10px;cursor:pointer}
    .btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;transition:background .12s, border-color .12s, transform .06s}
    .btn:hover{background:var(--hover);border-color:var(--ink-3)}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .btn--primary{background:var(--g-600);border-color:var(--g-600);color:#fff}
    .btn--primary:hover{background:var(--g-700);border-color:var(--g-700)}
    .btn--sm{padding:5px 10px;font-size:13px;font-weight:600}
    .btn--quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
    .btn--quiet:hover{background:var(--frame);border-color:transparent}
    .btn.is-on{color:var(--g-600)}
    .btn.is-on svg{fill:currentColor}

    /* ---------- Status / progress ---------- */
    .status{display:none;align-items:center;gap:10px;margin:0 0 18px;padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:13px}
    .status.show{display:flex}
    .status.error{background:var(--red-bg);border-color:#f0cfcf;color:var(--red)}
    .status.warn{background:var(--amber-bg);border-color:#f2dfbd;color:var(--amber)}
    .status__time{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-3)}
    .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--g-100);border-top-color:var(--g-600);animation:spin .8s linear infinite;flex:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}}

    /* ---------- Section heads ---------- */
    .head{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
    .head h2{margin:0;font-size:16px;color:var(--ink);letter-spacing:-.01em}
    .head .meta{font-size:12px;color:var(--ink-3)}

    /* ---------- This run: top pick + patterns ---------- */
    .insights{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
    @media (max-width:820px){.insights{grid-template-columns:1fr}}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
    .pick__name{display:inline-block;margin:8px 0 6px;background:var(--lime);color:#111;font-weight:800;font-size:20px;letter-spacing:-.02em;padding:2px 10px;border-radius:8px}
    .pick__idea{margin:0;color:var(--ink);font-weight:600}
    .pick__why{margin:6px 0 12px;color:var(--ink-3)}
    .pats{list-style:none;margin:8px 0 0;padding:0}
    .pats li{padding:9px 0;border-top:1px solid var(--line)}
    .pats li:first-child{border-top:0;padding-top:2px}
    .pats__top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .pats__top strong{color:var(--ink)}
    .pats__who,.pats__why{display:block;font-size:13px;color:var(--ink-3)}
    .memory{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:13px}

    /* ---------- Tabs ---------- */
    .tabs{display:inline-flex;background:var(--frame);border-radius:999px;padding:3px;gap:2px}
    .tab{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer}
    .tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
    .tab .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:500;margin-left:3px}

    /* ---------- Brief rows (one list, edges aligned like a receipt) ---------- */
    .list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
    .row{border-top:1px solid var(--line)}
    .row:first-child{border-top:0}
    .row > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,2.2fr) minmax(0,1.3fr) 112px 104px 56px 16px;gap:14px;align-items:center;padding:14px 16px}
    .row > summary::-webkit-details-marker{display:none}
    .row > summary:hover{background:var(--hover)}
    .row[open] > summary{background:var(--hover)}
    .row--skip > summary{opacity:.7}
    .cell-main{min-width:0}
    .names{display:flex;align-items:baseline;gap:8px;min-width:0}
    .names strong{color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .names .from{font-size:12px;color:var(--ink-3);white-space:nowrap}
    .alt{margin:2px 0 0;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
    .cell-for{font-size:13px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .cell-label{display:block;font-size:11px;color:var(--ink-3)}
    .cell-val{font-weight:600;color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fit{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
    .fit__bar{display:block;height:4px;border-radius:2px;background:var(--frame);margin-top:4px;overflow:hidden}
    .fit__bar i{display:block;height:100%;background:var(--g-600)}
    .chev{transition:transform .15s;color:var(--ink-3)}
    .row[open] .chev{transform:rotate(90deg)}
    @media (max-width:860px){
      .row > summary{grid-template-columns:56px minmax(0,1fr) 44px 16px;gap:10px}
      .cell-for,.cell-money,.cell-demand{display:none}
    }

    /* Pills: verdict, demand, potential, new */
    .pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
    .v-build{background:var(--g-600);color:#fff}
    .v-maybe{background:var(--amber-bg);color:var(--amber)}
    .v-skip{background:var(--frame);color:var(--ink-3)}
    .lvl-high{background:var(--g-100);color:var(--g-700)}
    .lvl-medium{background:var(--g-50);color:var(--g-600)}
    .lvl-low{background:var(--frame);color:var(--ink-3)}
    .new{background:var(--g-50);color:var(--g-600);font-size:10px;padding:1px 6px}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
    .dot.lvl-high{background:var(--g-600)} .dot.lvl-medium{background:#7fb8a1} .dot.lvl-low{background:var(--line-2)}

    /* Expanded brief: flat sections divided by hairlines, no boxes in boxes */
    .detail{padding:4px 16px 16px 94px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px}
    @media (max-width:860px){.detail{padding:4px 16px 16px;grid-template-columns:1fr}}
    .sec{padding:12px 0;border-top:1px solid var(--line)}
    .sec h3{margin:0 0 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
    .sec p{margin:0}
    .sec--wide{grid-column:1/-1}
    .tagline{color:var(--ink-3);font-style:italic}
    .kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;margin:0}
    .kv dt{color:var(--ink-3);font-size:13px}
    .kv dd{margin:0}
    .kw{width:100%;border-collapse:collapse;font-size:13px}
    .kw td{padding:5px 0;border-top:1px solid var(--line);vertical-align:baseline}
    .kw tr:first-child td{border-top:0}
    .kw .kw__t{color:var(--ink);font-weight:600;padding-right:10px}
    .kw .kw__i{color:var(--ink-3);padding:0 10px;white-space:nowrap}
    .kw .kw__l{text-align:right;white-space:nowrap}
    .kw .kw__l a{color:var(--ink-3);text-decoration:none;margin-left:8px}
    .kw .kw__l a:hover{color:var(--g-600)}
    .note{font-size:12px;color:var(--ink-3);margin-top:6px}
    .plan{list-style:none;margin:0;padding:0}
    .plan li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:5px 0;border-top:1px solid var(--line)}
    .plan li:first-child{border-top:0}
    .plan .when{color:var(--ink-3);font-size:13px}
    .files code{background:var(--frame);border-radius:6px;padding:1px 6px;font-size:12px}
    .actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
    .skipwhy{color:var(--amber)}

    /* Launch lines */
    .launches{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
    .launches > summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:12px 16px}
    .launches > summary::-webkit-details-marker{display:none}
    .launches > summary h2{margin:0;font-size:16px;color:var(--ink)}
    .launches > summary .meta{font-size:12px;color:var(--ink-3)}
    .launches > summary .chev{margin-left:auto}
    .launches[open] > summary .chev{transform:rotate(90deg)}
    .ll{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:8px 16px;border-top:1px solid var(--line);font-size:13px}
    .ll strong{color:var(--ink)}
    .ll span{color:var(--ink-3)}
    .ll a{color:var(--ink-3)}
    .ll a:hover{color:var(--g-600)}

    .empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
    .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s, transform .15s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    /* ---------- Phone ---------- */
    .btn{white-space:nowrap}
    .head{flex-wrap:wrap}
    @media (max-width:560px){
      .bar__in{gap:8px}
      .brand{width:100%}
      .tools{width:100%;flex-wrap:wrap}
      .tools .btn--primary{flex:1;justify-content:center}
      .head{gap:8px}
      .head .meta{width:100%}
      .names{flex-wrap:wrap;gap:2px 8px}
      .names strong{white-space:normal}
      .names .from{display:none}
      .ll{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
      .ll span{grid-column:1/2}
      .ll a{grid-row:1/3;grid-column:2;align-self:center}
    }
  
    /* ---------- Sources panel ---------- */
    .srcbtn .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:500}
    .sources{max-width:1080px;margin:0 auto;padding:14px 0 4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 24px}
    @media (max-width:760px){.sources{grid-template-columns:1fr}}
    .sources h3{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
    .src{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 8px;padding:5px 0;cursor:pointer}
    .src input{margin:3px 0 0;accent-color:var(--g-600)}
    .src strong{font-weight:600;color:var(--ink)}
    .src span{grid-column:2;font-size:12px;color:var(--ink-3)}
    .reddit-note{grid-column:1/-1;margin:6px 0 4px;padding:8px 10px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-size:13px}
    .chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface);white-space:nowrap}
    .chip--pain{border-color:#f2dfbd;color:var(--amber);background:var(--amber-bg)}
    .chip--idea{border-color:var(--g-100);color:var(--g-600);background:var(--g-50)}
    .ll{grid-template-columns:minmax(0,260px) minmax(0,1fr) auto}
    .ll .meta2{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
    .why{font-size:12px;color:var(--g-600);margin-top:2px}
    .progress{height:3px;background:var(--frame);border-radius:2px;overflow:hidden;width:120px;flex:none}
    .progress i{display:block;height:100%;background:var(--g-600);transition:width .3s}
    .more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:10px;color:var(--g-600);font-weight:600;cursor:pointer}
    .more:hover{background:var(--hover)}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="bar__in">
      <div class="brand"><h1>Idea Sifter</h1><span>Launches, pain points and ideas → weekend builds</span></div>
      <div class="tools">
        <button class="btn srcbtn" id="sourcesBtn" type="button" aria-expanded="false" aria-controls="sourcesPanel">Sources <span class="n" id="srcCount"></span></button>
        <label class="count" for="briefCount">Briefs
          <select id="briefCount"><option>10</option><option selected>15</option><option>20</option><option>25</option></select>
        </label>
        <button class="btn" id="refreshBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.3M3 12A9 9 0 0 1 18.5 5.7"/><path d="M21 4v5h-5M3 20v-5h5"/></svg>Refresh</button>
        <button class="btn btn--primary" id="analyzeBtn" type="button" disabled>Find weekend builds</button>
      </div>
    </div>
    <div class="sources" id="sourcesPanel" hidden></div>
  </header>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section id="insights" hidden></section>

  <div class="head">
    <h2>Weekend builds</h2>
    <div class="tabs" role="tablist" aria-label="Filter builds">
      <button class="tab" role="tab" data-tab="best" aria-selected="true">Best<span class="n" id="nBest"></span></button>
      <button class="tab" role="tab" data-tab="saved" aria-selected="false">Saved<span class="n" id="nSaved"></span></button>
      <button class="tab" role="tab" data-tab="skip" aria-selected="false">Skipped<span class="n" id="nSkip"></span></button>
    </div>
    <span class="meta" id="resultMeta"></span>
  </div>
  <div id="results" class="list"><p class="empty">No builds yet. Hit <strong>Find weekend builds</strong> to sift the inbox below.</p></div>

  <div style="height:18px"></div>
  <details class="launches" id="launchBox" open>
    <summary><h2>Inbox</h2><span class="meta" id="launchCount">Loading…</span><svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></summary>
    <div id="launches"></div>
  </details>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const API_URL = "https://6cu5wlvx2mylhy7xzdefy5bsya0ccmxb.lambda-url.us-east-1.on.aws/";

  /* ---------- Sources: three kinds of signal ---------- */
  const REDDIT_END = new Date("2026-11-13T00:00:00Z");
  const SOURCES = [
    { id: "betalist", group: "Launches", kind: "launch", label: "BetaList", url: "https://feeds.feedburner.com/BetaList" },
    { id: "producthunt", group: "Launches", kind: "launch", label: "Product Hunt", url: "https://www.producthunt.com/feed" },
    { id: "showhn", group: "Launches", kind: "launch", label: "Show HN", hint: "10+ points", url: "https://hnrss.org/show?points=10" },
    { id: "rlaunch", group: "Launches", kind: "launch", label: "Reddit launches", reddit: true, hint: "r/SideProject, SaaS, microsaas, indiehackers, buildinpublic, RoastMyStartup",
      url: "https://www.reddit.com/r/SideProject+SaaS+microsaas+indiehackers+buildinpublic+RoastMyStartup/new.rss?limit=100" },
    { id: "rpain", group: "Pain points", kind: "pain", label: "Reddit pain points", reddit: true, hint: "r/smallbusiness, productivity, selfhosted, EntrepreneurRideAlong, SaaS",
      url: "https://www.reddit.com/r/smallbusiness+productivity+selfhosted+EntrepreneurRideAlong+SaaS/new.rss?limit=100" },
    { id: "rwish", group: "Pain points", kind: "pain", label: "Reddit tool requests", reddit: true, hint: "\u201cis there a tool\u201d, \u201cI wish there was\u201d, \u201calternative to\u201d",
      url: "https://www.reddit.com/search.rss?q=%22is%20there%20a%20tool%22%20OR%20%22I%20wish%20there%20was%22%20OR%20%22alternative%20to%22%20OR%20%22looking%20for%20a%20tool%22&sort=new&limit=100" },
    { id: "rideas", group: "Ideas", kind: "idea", label: "r/AppIdeas", reddit: true, hint: "Apps people wish existed", url: "https://www.reddit.com/r/AppIdeas/new.rss?limit=50" }
  ];
  const PER_SOURCE = 40;          // newest posts kept per source
  const BATCH = 5, PARALLEL = 3;  // briefs per Gemini call, calls at once

  const state = { items: [], ideas: [], patterns: [], topPick: null, analyzedAt: null, meta: null, newKeys: new Set(), tab: "best", inboxAll: false, failed: [] };

  /* ---------- Memory: this browser only ---------- */
  const KEYS = { seen: "sifter.seen", shortlist: "sifter.shortlist", patterns: "sifter.patterns", last: "sifter.last", sources: "sifter.sources" };
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* memory is a nice-to-have */ } }
  };
  const launchKey = x => (x.source_url || x.name || "").toLowerCase().replace(/[?#].*$/, "").replace(/\/$/, "");
  const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }); } catch { return ""; } };
  const enabled = () => { const saved = store.get(KEYS.sources, null); return SOURCES.filter(s => saved ? saved.includes(s.id) : true); };

  /* ---------- Icons ---------- */
  const ICON = {
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    ext: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'
  };
  const icon = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
  const lvl = v => (String(v || "low").toLowerCase().match(/high|medium|low/) || ["low"])[0];

  function escapeHtml(value="") {

  /* ---------- Feeds: one parser for Atom and RSS, plus each source's quirks ---------- */
  // Block tags become spaces first, so neighbouring paragraphs don't run together ("xPoints: 12").
  const textOf = html => { const d = document.createElement("div"); d.innerHTML = String(html || "").replace(/<\/(p|div|li|h[1-6]|blockquote|pre|tr)>|<br\s*\/?>|<hr\s*\/?>/gi, " $&"); return (d.textContent || "").replace(/\s+/g, " ").trim(); };

        </div>`}
        <div class="actions">
          <button class="btn btn--sm btn--quiet${isSaved(x) ? " is-on" : ""}" type="button" data-save="${idx}">${icon("star")}${isSaved(x) ? " Saved" : " Save"}</button>
          <button class="btn btn--sm btn--quiet" type="button" data-copy="${idx}">${icon("copy")} Copy brief</button>
          ${x.source_url ? `<a class="btn btn--sm btn--quiet" href="${escapeHtml(normalizeUrl(x.source_url))}" target="_blank" rel="noopener">${icon("ext")} Original</a>` : ""}
        </div>
      </div>
    </details>`;
  }
  function setTab(t) {
    state.tab = t;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    renderIdeas();
  }
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

  /* ---------- Network ---------- */
  async function postJson(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch { data = text; }
    if (!res.ok) { const e = new Error((data && data.error) || `The Lambda returned ${res.status}.`); e.status = res.status; throw e; }
    return data;
  }
  function friendly(err) {
    const msg = (err && err.message) || "Something went wrong.";
    return /Failed to fetch|NetworkError|Load failed/i.test(msg) ? "Couldn't reach the Lambda. Check the Function URL's CORS allows this page (use * while testing)." : msg;
  }
  async function pool(tasks, n) {                // run async tasks n at a time
    const results = []; let i = 0;
    await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, async () => { while (i < tasks.length) { const k = i++; results[k] = await tasks[k](); } }));
    return results;
  }

  /* ---------- Is the Lambda healthy? One check, one clear message ---------- */
  let healthy = false;
  async function checkLambda() {
    if (healthy) return null;
    let res, text = "";
    try { res = await fetch(API_URL.replace(/\/$/, "") + "/health", { cache: "no-store" }); text = await res.text(); }
    catch { return "Couldn't reach the Lambda at all. Most likely CORS: in the Function URL settings, set Allow origin to * and Allow headers to Content-Type."; }
    let data = null; try { data = JSON.parse(text); } catch { /* not JSON */ }
    if (data && data.service === "betalist-idea-sifter") { healthy = true; return null; }
    if (data && data.service === "checkaeo-scan") return "Your Lambda is still running the old Aeoden scanner code. Upload betalist-sifter-lambda.zip again (Code → Upload from → .zip file), then set Handler to index.handler.";
    if (res.status === 502 || /Internal Server Error/i.test(text)) return "The Lambda crashes before it can answer (HTTP 502). Almost always the handler setting: Runtime settings → Edit → Handler: index.handler, Runtime: Node.js 20.x or newer. The exact error is in CloudWatch Logs.";
    if (res.status === 403) return "The Function URL refused the request (HTTP 403). Check its Auth type is NONE.";
    return `The Lambda answered /health with HTTP ${res.status}: ${text.slice(0, 120)}`;
  }

  /* ---------- Refresh: every enabled source, in parallel ---------- */
  async function refreshFeed() {
    const srcs = enabled();
    if (!srcs.length) { setStatus("Pick at least one source.", "warn"); return; }
    const problem = await checkLambda();
    if (problem) { setStatus(problem, "error"); $("refreshBtn").disabled = false; return; }
    $("refreshBtn").disabled = true; $("analyzeBtn").disabled = true;
    setStatus(`Fetching ${srcs.length} source${srcs.length === 1 ? "" : "s"}…`, "", true);
    const failed = [];
    const lists = await pool(srcs.map(src => async () => {
      try {
        const payload = await postJson(API_URL, { action: "fetch_feed", url: src.url });
        return parseEntries(extractXml(payload)).slice(0, PER_SOURCE).map(e => toItem(e, src)).filter(x => x.name);
      } catch (err) {
        const m = String(err.message || "").match(/HTTP (\d{3})/);
        failed.push(`${src.label}: ${m ? `blocked (HTTP ${m[1]})` : (err.message || "failed").slice(0, 60)}`);
        return [];
      }
    }), 4);
    // De-duplicate across sources by link, then by name
    const seenUrl = new Set(), seenName = new Set(), items = [];
    for (const x of lists.flat()) {
      const u = launchKey(x), n = nameKey(x.name);
      if ((u && seenUrl.has(u)) || (n && seenName.has(n))) continue;
      if (u) seenUrl.add(u); if (n) seenName.add(n); items.push(x);
    }
    state.items = items; state.failed = failed; state.inboxAll = false;
    const seen = store.get(KEYS.seen, {}), now = new Date().toISOString();
    items.forEach(x => { const k = launchKey(x); if (k && !seen[k]) seen[k] = now; });
    const dayAgo = Date.now() - 864e5;
    state.newKeys = new Set(items.map(launchKey).filter(k => k && Date.parse(seen[k]) > dayAgo));
    store.set(KEYS.seen, Object.fromEntries(Object.entries(seen).sort((a, b) => b[1].localeCompare(a[1])).slice(0, 4000)));
    renderLaunches(); renderIdeas();
    if (!items.length) setStatus(failed.length ? `Nothing loaded. ${failed.join(" · ")}` : "The sources had no posts.", "error");
    else if (failed.length) setStatus(`Loaded ${items.length} posts. Couldn't load: ${failed.join(" · ")}${failed.some(f => /Reddit|r\//.test(f) && /403|429/.test(f)) ? ". Reddit often blocks cloud servers; the other sources still work." : ""}`, "warn");
    else clearStatus();
    $("refreshBtn").disabled = false;
    $("analyzeBtn").disabled = items.length === 0;
  }

  /* ---------- Find weekend builds: sift everything, then brief the best ---------- */
  async function analyze() {
    const all = state.items;
    if (!all.length) return;
    const keep = Number($("briefCount").value);
    $("analyzeBtn").disabled = true; $("refreshBtn").disabled = true;
    setStatus.t0 = null;
    try {
      // Stage 1: one fast pass over every post
      setStatus(`Sifting ${all.length} posts for the best ${keep}…`, "", true);
      const history = [...new Set(store.get(KEYS.patterns, []).map(p => p.problem))].slice(0, 30);
      const tri = await postJson(API_URL, { action: "triage", keep, history,
        items: all.map((x, id) => ({ id, kind: x.kind, source: x.source, name: x.name, text: x.description.slice(0, 280) })) });
      const picks = (tri.picks || []).filter(p => all[p.id]);
      if (!picks.length) { setStatus(`Sifted ${all.length} posts and nothing looked weekend-sized. Try more sources or a later refresh.`, "warn"); return; }
      state.ideas = []; state.patterns = tri.patterns || []; state.topPick = null; state.analyzedAt = new Date().toISOString();
      state.meta = { considered: tri.considered || all.length, picked: picks.length };
      setTab("best"); renderInsights();
      $("launchBox").open = false;

      // Stage 2: full briefs for the picks, a few batches at a time
      const chosen = picks.map(p => ({ item: all[p.id], why: p.why }));
      const batches = []; for (let i = 0; i < chosen.length; i += BATCH) batches.push(chosen.slice(i, i + BATCH));
      let done = 0, failedBatches = 0;
      const progress = () => setStatus(`${all.length} posts sifted → writing ${chosen.length} briefs · ${done} of ${batches.length} batches done`, "", true, done / batches.length);
      progress();
      await pool(batches.map(batch => async () => {
        try {
          const res = await postJson(API_URL, { action: "analyze_betalist", briefs_only: true,
            items: batch.map(({ item }) => ({ name: item.name, description: item.description, source_url: item.source_url, date: item.date, kind: item.kind, source: item.source })) });
          extractIdeas(res).forEach((idea, i) => {
            const src = batch[i] || batch.find(b => b.item.name === idea.name) || {};
            state.ideas.push({ ...idea, _kind: src.item ? src.item.kind : "launch", _source: src.item ? src.item.source : "", _why: src.why || "", source_url: idea.source_url || (src.item && src.item.source_url) || "" });
          });
          state.topPick = pickTop(state.ideas);
          renderInsights(); renderIdeas();
        } catch (err) { failedBatches++; console.error(err); }
        done++; progress();
      }), PARALLEL);

      rememberPatterns(state.patterns, state.analyzedAt);
      store.set(KEYS.last, { at: state.analyzedAt, ideas: state.ideas, patterns: state.patterns, topPick: state.topPick, meta: state.meta });
      const builds = state.ideas.filter(x => x.verdict === "BUILD").length;
      setStatus(`${state.meta.considered} posts sifted → ${state.ideas.length} briefs · ${builds} worth building${failedBatches ? ` · ${failedBatches} batch${failedBatches === 1 ? "" : "es"} failed (try again for the rest)` : ""}.`, failedBatches ? "warn" : "");
      if (!failedBatches) setTimeout(() => { if ($("status").textContent.includes("worth building")) clearStatus(); }, 8000);
    } catch (err) {
      setStatus(friendly(err), "error");
    } finally {
      $("analyzeBtn").disabled = state.items.length === 0;
      $("refreshBtn").disabled = false;
    }
  }

  $("refreshBtn").addEventListener("click", refreshFeed);
  $("analyzeBtn").addEventListener("click", analyze);

  /* ---------- Start: restore the last run, then fetch fresh posts ---------- */
  const last = store.get(KEYS.last, null);
  if (last && Array.isArray(last.ideas)) {
    state.ideas = last.ideas; state.patterns = last.patterns || []; state.topPick = last.topPick || null; state.analyzedAt = last.at || null; state.meta = last.meta || null;
    $("launchBox").open = false;
  }
  renderSources(); renderInsights(); renderIdeas(); renderLaunches();
  refreshFeed();
})();
</script>
</body>
