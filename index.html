<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Idea Sifter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5f46'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23dfff3f' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    /* ============ Neobrutalist workbench ============
       Chunky ink outlines, hard offset shadows that press when clicked,
       flat colour blocks with one meaning each:
       lime = BUILD / top pick · orange = MAYBE / pain · violet = idea · sky = launch · grey = SKIP */
    :root{
      --paper:#fff6dc; --card:#fffdf5; --ink:#111; --ink-2:#2b2b2b; --ink-3:#5c5a52; --line:#111;
      --lime:#c8ff3e; --orange:#ff9a3c; --violet:#c3a6ff; --sky:#8ed8ff; --pink:#ff86c2; --grey:#e7e1cf; --red:#ff6b6b;
      --b:2.5px solid var(--ink); --sh:4px 4px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink); --r:10px;
      --display:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono:"Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    *{box-sizing:border-box}
    [hidden]{display:none !important}
    body{margin:0;background:var(--paper);color:var(--ink-2);font:15px/1.5 var(--display);-webkit-font-smoothing:antialiased;
      background-image:radial-gradient(rgba(17,17,17,.09) 1px, transparent 1.2px);background-size:18px 18px}
    button,select,input{font:inherit;color:inherit}
    a{color:var(--ink)}
    :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
    .wrap{max-width:1140px;margin:0 auto;padding:0 20px 72px}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

    /* Toolbar: a black slab */
    .bar{position:sticky;top:0;z-index:5;margin:0 -20px 22px;padding:12px 20px;background:var(--ink);color:var(--paper);box-shadow:0 0 0 100vmax var(--ink);clip-path:inset(0 -100vmax)}
    .bar__in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
    .brand{display:flex;flex-direction:column;margin-right:auto}
    .brand h1{margin:0;font-size:24px;line-height:1;letter-spacing:-.03em;font-weight:700;color:var(--lime)}
    .brand span{font:12px var(--mono);color:#cfc8b4;margin-top:4px}
    .tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    .count{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:#cfc8b4;text-transform:uppercase}
    select{border:var(--b);border-color:var(--paper);background:var(--ink);color:var(--paper);border-radius:8px;padding:6px 8px;font:13px var(--mono);cursor:pointer}

    /* Buttons press into their shadow */
    .btn{display:inline-flex;align-items:center;gap:7px;border:var(--b);background:var(--card);color:var(--ink);border-radius:var(--r);padding:8px 14px;font-weight:700;cursor:pointer;
      box-shadow:var(--sh-sm);text-decoration:none;white-space:nowrap;transition:transform .06s, box-shadow .06s, background .1s}
    .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
    .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
    .bar .btn{border-color:var(--paper);box-shadow:3px 3px 0 var(--paper)}
    .bar .btn:hover{box-shadow:4px 4px 0 var(--paper)}
    .bar .btn:active{box-shadow:0 0 0 var(--paper)}
    .btn--primary{background:var(--lime)}
    .bar .btn--primary{color:var(--ink)}
    .btn--sm{padding:5px 10px;font-size:13px}
    .btn--quiet{background:var(--card)}
    .btn--plan{background:var(--lime)}
    .btn.is-on{background:var(--pink)}
    .btn.is-on svg{fill:currentColor}
    .srcbtn .n{font:12px var(--mono);opacity:.75}

    /* Sources drawer */
    .sources{max-width:1100px;margin:12px auto 2px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 24px;background:var(--paper);color:var(--ink);border:var(--b);border-color:var(--paper);border-radius:var(--r)}
    @media (max-width:760px){.sources{grid-template-columns:1fr}}
    .sources h3{margin:0 0 6px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.04em}
    .src{display:grid;grid-template-columns:20px minmax(0,1fr);gap:2px 8px;padding:5px 0;cursor:pointer}
    .src input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--ink)}
    .src strong{font-weight:700}
    .src span{grid-column:2;font:12px var(--mono);color:var(--ink-3)}
    .reddit-note{grid-column:1/-1;margin:8px 0 0;padding:8px 10px;border:var(--b);border-radius:8px;background:var(--orange);font-size:13px;font-weight:600}

    /* Status */
    .status{display:none;align-items:center;gap:12px;margin:0 0 20px;padding:10px 14px;border:var(--b);border-radius:var(--r);background:var(--card);box-shadow:var(--sh);font-weight:600;font-size:14px}
    .status.show{display:flex}
    .status.error{background:var(--red)}
    .status.warn{background:var(--orange)}
    .status__time{margin-left:auto;font:13px var(--mono)}
    .spin{width:14px;height:14px;border:2.5px solid var(--ink);background:var(--lime);animation:spin 1s steps(4) infinite;flex:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}}
    .progress{height:12px;width:140px;border:var(--b);border-radius:6px;background:var(--card);overflow:hidden;flex:none}
    .progress i{display:block;height:100%;background:var(--lime);border-right:var(--b);transition:width .3s}

    /* Section heads */
    .head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:30px 0 14px}
    .head h2{margin:0;font-size:26px;letter-spacing:-.03em;font-weight:700;color:var(--ink)}
    .head .meta{font:12px var(--mono);color:var(--ink-3)}

    /* This run */
    .insights{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
    @media (max-width:820px){.insights{grid-template-columns:1fr}}
    .panel{background:var(--card);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
    .panel--pick{background:var(--lime)}
    .eyebrow{display:inline-block;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:1px 7px}
    .pick__name{display:block;margin:10px 0 6px;font-size:30px;line-height:1.05;font-weight:700;letter-spacing:-.04em;color:var(--ink)}
    .pick__idea{margin:0;color:var(--ink);font-weight:600}
    .pick__why{margin:6px 0 14px;color:var(--ink-2)}
    .pats{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
    .pats li{padding:8px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--paper)}
    .pats__top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .pats__top strong{color:var(--ink)}
    .pats__who,.pats__why{display:block;font-size:13px;color:var(--ink-3)}
    .memory{margin:12px 0 0;font-size:13px}
    .note{font:12px var(--mono);color:var(--ink-3);margin:4px 0 0}

    /* Tabs: chunky segmented control */
    .tabs{display:inline-flex;border:var(--b);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm);background:var(--card)}
    .tab{border:0;border-right:var(--b);background:transparent;padding:6px 14px;font-weight:700;cursor:pointer}
    .tab:last-child{border-right:0}
    .tab[aria-selected="true"]{background:var(--ink);color:var(--lime)}
    .tab .n{font:12px var(--mono);margin-left:4px;opacity:.8}

    /* Decision rows: each one a card */
    .list{display:grid;gap:14px}
    .row{background:var(--card);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
    .row > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:76px minmax(0,2.2fr) minmax(0,1.3fr) 108px 110px 64px 74px 18px;gap:14px;align-items:center;padding:14px 16px}
    .row > summary::-webkit-details-marker{display:none}
    .row > summary:hover{background:#fff8e3}
    .row[open] > summary{border-bottom:var(--b)}
    .row--skip{opacity:.78}
    .cell-main{min-width:0}
    .names{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
    .names strong{color:var(--ink);font-size:17px;letter-spacing:-.02em;font-weight:700}
    .from{font:12px var(--mono);color:var(--ink-3)}
    .alt{margin:3px 0 0;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
    .cell-for{font-size:13px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .cell-label{display:block;font:11px var(--mono);color:var(--ink-3);text-transform:uppercase}
    .cell-val{font:700 14px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fit{font:700 22px var(--mono);color:var(--ink);text-align:right;line-height:1}
    .fit__bar{display:block;height:8px;margin-top:6px;border:2px solid var(--ink);border-radius:4px;background:var(--card);overflow:hidden}
    .fit__bar i{display:block;height:100%;background:var(--ink)}
    .chev{transition:transform .15s}
    .row[open] .chev{transform:rotate(90deg)}
    @media (max-width:860px){
      .row > summary{grid-template-columns:70px minmax(0,1fr) 44px 64px 18px;gap:8px}
      .cell-for,.cell-money,.cell-demand{display:none}
    }

    /* Pills & chips */
    .pill{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:7px;padding:2px 8px;font:700 12px var(--mono);letter-spacing:.02em;white-space:nowrap;color:var(--ink)}
    .v-build{background:var(--lime)} .v-maybe{background:var(--orange)} .v-skip{background:var(--grey)}
    .lvl-high{background:var(--lime)} .lvl-medium{background:var(--sky)} .lvl-low{background:var(--grey)}
    .new{background:var(--pink);font-size:10px;padding:0 5px}
    .chip{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:6px;padding:0 6px;font:700 11px var(--mono);background:var(--card);white-space:nowrap}
    .chip--launch{background:var(--sky)} .chip--pain{background:var(--orange)} .chip--idea{background:var(--violet)}

    /* Decision card body: six tiles */
    .detail{padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    @media (max-width:860px){.detail{grid-template-columns:1fr}}
    .tile{border:2px solid var(--ink);border-radius:8px;padding:10px 12px;background:var(--paper)}
    .tile h3{margin:0 0 4px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
    .tile p{margin:0;color:var(--ink)}
    .tile--wide{grid-column:1/-1}
    .tile--reason.v-build{background:var(--lime)} .tile--reason.v-maybe{background:var(--orange)} .tile--reason.v-skip{background:var(--grey)}
    .tile--reason p{font-weight:700;font-size:16px}
    .big{font:700 20px var(--mono);color:var(--ink)}
    .kwl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
    .kwl li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .kwl .k{font-weight:700;color:var(--ink)}
    .kwl a{color:var(--ink);display:inline-flex}
    .src-line{grid-column:1/-1;font:12px var(--mono);color:var(--ink-3)}
    .actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}

    /* The plan, once generated */
    .planbox{grid-column:1/-1;border:var(--b);border-radius:var(--r);background:var(--card);padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    @media (max-width:860px){.planbox{grid-template-columns:1fr}}
    .planbox > h3{grid-column:1/-1;margin:0;font-size:20px;letter-spacing:-.02em;color:var(--ink)}
    .namechips{display:flex;flex-wrap:wrap;gap:6px}
    .namechips span{border:2px solid var(--ink);border-radius:7px;padding:2px 9px;font-weight:700;background:var(--violet)}
    .namechips span:first-child{background:var(--lime)}
    .tagline{font-style:italic;color:var(--ink-2);margin:6px 0 0}
    .kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:0}
    .kv dt{font:12px var(--mono);color:var(--ink-3);text-transform:uppercase}
    .kv dd{margin:0}
    .kw{width:100%;border-collapse:collapse;font-size:14px}
    .kw td{padding:5px 0;border-top:2px dashed rgba(17,17,17,.25);vertical-align:baseline}
    .kw tr:first-child td{border-top:0}
    .kw .kw__t{font-weight:700;color:var(--ink);padding-right:10px}
    .kw .kw__i{font:12px var(--mono);color:var(--ink-3);padding:0 10px}
    .kw .kw__l{text-align:right;white-space:nowrap}
    .kw .kw__l a{margin-left:8px;color:var(--ink)}
    .steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
    .steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
    .steps .when{font:700 11px var(--mono);text-transform:uppercase;background:var(--sky);border:2px solid var(--ink);border-radius:6px;padding:1px 6px;white-space:nowrap}
    .files code{font:12px var(--mono);background:var(--paper);border:2px solid var(--ink);border-radius:5px;padding:0 5px}

    /* Inbox */
    .launches{background:var(--card);border:var(--b);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
    .launches > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px}
    .launches > summary::-webkit-details-marker{display:none}
    .launches > summary h2{margin:0;font-size:22px;letter-spacing:-.03em;color:var(--ink)}
    .launches > summary .meta{font:12px var(--mono);color:var(--ink-3)}
    .launches > summary .chev{margin-left:auto}
    .launches[open] > summary{border-bottom:var(--b)}
    .launches[open] > summary .chev{transform:rotate(90deg)}
    .ll{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 16px;border-top:2px dashed rgba(17,17,17,.2);font-size:14px}
    .ll:first-child{border-top:0}
    .ll strong{color:var(--ink)}
    .ll > span{color:var(--ink-3)}
    .ll .meta2{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
    .more{display:block;width:100%;border:0;border-top:var(--b);background:var(--lime);padding:10px;font-weight:700;cursor:pointer}

    .empty{margin:0;padding:28px 16px;text-align:center;color:var(--ink-2);background:var(--card);border:var(--b);border-radius:var(--r);box-shadow:var(--sh)}
    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--lime);color:var(--ink);border:var(--b);box-shadow:var(--sh);padding:8px 16px;border-radius:var(--r);font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s, transform .15s}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media (max-width:560px){
      .brand{width:100%}
      .tools{width:100%}
      .tools .btn--primary{flex:1;justify-content:center}
      .ll{grid-template-columns:minmax(0,1fr) auto}
      .ll > span{grid-column:1/2}
      .ll a{grid-row:1/3;grid-column:2}
      .from{display:none}
    }
    /* Step guide */
    .stepper{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:0 0 20px;padding:12px 14px;background:var(--card);border:var(--b);border-radius:var(--r);box-shadow:var(--sh)}
    .stepper ol{list-style:none;display:flex;gap:6px;margin:0;padding:0;flex-wrap:wrap}
    .stepper li{display:flex;align-items:center;gap:6px;font:700 12px var(--mono);text-transform:uppercase;padding:4px 10px 4px 4px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink-3)}
    .stepper li span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:11px}
    .stepper li.done{background:var(--grey);color:var(--ink)}
    .stepper li.done span{background:var(--ink);color:var(--lime)}
    .stepper li.now{background:var(--lime);color:var(--ink)}
    .stepper p{margin:0;flex:1;min-width:220px;font-weight:600;color:var(--ink)}
    /* Settings drawer */
    .sources{display:block}
    .setrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-bottom:12px;margin-bottom:12px;border-bottom:2px dashed rgba(17,17,17,.3)}
    .sources .count{color:var(--ink);font-weight:700}
    .sources select{background:var(--card);color:var(--ink);border-color:var(--ink)}
    .srcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 24px}
    @media (max-width:760px){.srcgrid{grid-template-columns:1fr}}
    /* Card titles: your app's name first, the source second */
    .inspired{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-top:3px;font:12px var(--mono);color:var(--ink-3)}
    .inspired b{color:var(--ink)}
    .chip--planned{background:var(--lime)}
    .pick__from{margin:-2px 0 8px;font:12px var(--mono);color:var(--ink-2)}
    .row > summary > *{min-width:0}
    .cell-val{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.3}
    /* All posts: ranked, filterable, actionable */
    .filters{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:var(--b);background:var(--paper)}
    .fchip{border:2px solid var(--ink);border-radius:999px;background:var(--card);padding:3px 10px;font:700 12px var(--mono);cursor:pointer}
    .fchip span{opacity:.6;margin-left:2px}
    .fchip.on{background:var(--ink);color:var(--lime)}
    .ll{grid-template-columns:44px minmax(0,1fr) auto !important;align-items:start}
    .ll--low{opacity:.6}
    .score{width:40px;height:40px;display:grid;place-items:center;border:var(--b);border-radius:8px;font:700 18px var(--mono);color:var(--ink)}
    .s-hi{background:var(--lime)} .s-mid{background:var(--sky)} .s-lo{background:var(--grey)} .s-none{background:var(--card);color:var(--ink-3)}
    .ll__main p{margin:0}
    .angle{font-weight:700;color:var(--ink);margin-bottom:2px !important}
    .ll__title{font-size:13px;color:var(--ink-2)}
    .ll__text{font-size:13px;color:var(--ink-3)}
    .ll__actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .btn--pass{background:var(--grey)}
    .ll__actions a{grid-row:auto !important;grid-column:auto !important}
    .more-cards{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:6px 2px}
    @media (max-width:560px){.ll{grid-template-columns:40px minmax(0,1fr) !important}.ll__actions{grid-column:1/-1;justify-content:flex-start}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="bar__in">
      <div class="brand"><h1>Idea Sifter</h1><span>launches · pain points · ideas → weekend builds</span></div>
      <div class="tools">
        <button class="btn srcbtn" id="sourcesBtn" type="button" aria-expanded="false" aria-controls="sourcesPanel">Settings <span class="n" id="srcCount"></span></button>
        <button class="btn" id="refreshBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.3M3 12A9 9 0 0 1 18.5 5.7"/><path d="M21 4v5h-5M3 20v-5h5"/></svg>Refresh</button>
        <button class="btn btn--primary" id="analyzeBtn" type="button" disabled>Find weekend builds</button>
      </div>
    </div>
    <div class="sources" id="sourcesPanel" hidden>
      <div class="setrow">
        <label class="count" for="perSource">Posts per source
          <select id="perSource"><option>10</option><option selected>20</option><option>40</option></select>
        </label>
        <label class="count" for="briefCount">Cards per run
          <select id="briefCount"><option>5</option><option selected>8</option><option>10</option><option>15</option><option>20</option></select>
        </label>
        <span class="note">Fewer cards = better quality on Flash-Lite.</span>
      </div>
      <div class="srcgrid" id="sourcesList"></div>
    </div>
  </header>

  <nav class="stepper" id="stepper" aria-label="Where you are"></nav>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section id="insights" hidden></section>

  <div class="head">
    <h2>Weekend builds</h2>
    <div class="tabs" role="tablist" aria-label="Filter builds">
      <button class="tab" role="tab" data-tab="best" aria-selected="true">Best<span class="n" id="nBest"></span></button>
      <button class="tab" role="tab" data-tab="saved" aria-selected="false">Saved<span class="n" id="nSaved"></span></button>
      <button class="tab" role="tab" data-tab="passed" aria-selected="false">Passed<span class="n" id="nSkip"></span></button>
    </div>
    <span class="meta" id="resultMeta"></span>
  </div>
  <div id="results" class="list"><p class="empty">No builds yet. Hit <strong>Find weekend builds</strong> to sift the inbox below.</p></div>

  <div style="height:18px"></div>
  <details class="launches" id="launchBox" open>
    <summary><h2>All posts</h2><span class="meta" id="launchCount">Loading…</span><svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></summary>
    <div id="launches"></div>
  </details>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const API_URL = "https://6cu5wlvx2mylhy7xzdefy5bsya0ccmxb.lambda-url.us-east-1.on.aws/";

  /* ---------- Sources: three kinds of signal ---------- */
  const REDDIT_END = new Date("2026-11-13T00:00:00Z");
  const SOURCES = [
    { id: "betalist", group: "Launches", kind: "launch", label: "BetaList", url: "https://feeds.feedburner.com/BetaList" },
    { id: "producthunt", group: "Launches", kind: "launch", label: "Product Hunt", url: "https://www.producthunt.com/feed" },
    { id: "showhn", group: "Launches", kind: "launch", label: "Show HN", hint: "10+ points", url: "https://hnrss.org/show?points=10" },
    { id: "rlaunch", group: "Launches", kind: "launch", label: "Reddit launches", reddit: true, hint: "r/SideProject, SaaS, microsaas, indiehackers, buildinpublic, RoastMyStartup",
      url: "https://www.reddit.com/r/SideProject+SaaS+microsaas+indiehackers+buildinpublic+RoastMyStartup/new.rss?limit=100" },
    { id: "rpain", group: "Pain points", kind: "pain", label: "Reddit pain points", reddit: true, hint: "r/smallbusiness, productivity, selfhosted, EntrepreneurRideAlong, SaaS",
      url: "https://www.reddit.com/r/smallbusiness+productivity+selfhosted+EntrepreneurRideAlong+SaaS/new.rss?limit=100" },
    { id: "rwish", group: "Pain points", kind: "pain", label: "Reddit tool requests", reddit: true, hint: "\u201cis there a tool\u201d, \u201cI wish there was\u201d, \u201calternative to\u201d",
      url: "https://www.reddit.com/search.rss?q=%22is%20there%20a%20tool%22%20OR%20%22I%20wish%20there%20was%22%20OR%20%22alternative%20to%22%20OR%20%22looking%20for%20a%20tool%22&sort=new&limit=100" },
    { id: "rideas", group: "Ideas", kind: "idea", label: "r/AppIdeas", reddit: true, hint: "Apps people wish existed", url: "https://www.reddit.com/r/AppIdeas/new.rss?limit=50" }
  ];
  const BATCH = 4, PARALLEL = 3;  // decision cards per Gemini call (short cards stay reliable on Flash-Lite), calls at once

  const state = { items: [], ideas: [], patterns: [], topPick: null, analyzedAt: null, meta: null, newKeys: new Set(), tab: "best", inboxAll: false, failed: [], filter: "all", carding: false };

  /* ---------- Memory: this browser only ---------- */
  const KEYS = { seen: "sifter.seen", shortlist: "sifter.shortlist", patterns: "sifter.patterns", last: "sifter.last", sources: "sifter.sources", settings: "sifter.settings", rank: "sifter.rank", passed: "sifter.passed" };
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* memory is a nice-to-have */ } }
  };
  const launchKey = x => (x.source_url || x.name || "").toLowerCase().replace(/[?#].*$/, "").replace(/\/$/, "");
  const fmtDate = iso => { try { return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }); } catch { return ""; } };
  const enabled = () => { const saved = store.get(KEYS.sources, null); return SOURCES.filter(s => saved ? saved.includes(s.id) : true); };

  /* ---------- Icons ---------- */
  const ICON = {
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    ext: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'
  };
  const icon = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
  const lvl = v => (String(v || "low").toLowerCase().match(/high|medium|low/) || ["low"])[0];
  const KIND_LABEL = { launch: "Launch", pain: "Pain point", idea: "Idea" };
  const kindChip = k => `<span class="chip chip--${k || "launch"}">${KIND_LABEL[k] || "Launch"}</span>`;

  function escapeHtml(value="") {
    return String(value).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[c]));
  }
  function normalizeUrl(url) {
    if (!url) return "";
    try { return new URL(url).href; } catch { return url; }
  }
  function stripHtml(html="") {
    const div = document.createElement("div");
    div.innerHTML = html;
    return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
  }
  function unwrapBody(value) {
    if (value == null) return value;

    if (typeof value === "string") {
      const cleaned = value
        .trim()
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/\s*```$/i, "");
      try { return JSON.parse(cleaned); } catch { return value; }
    }

    if (value.body != null) {
      return unwrapBody(value.body);
    }

    return value;
  }
  function extractIdeas(payload) {
    let data = unwrapBody(payload);

    if (Array.isArray(data)) return data;
    if (Array.isArray(data?.ideas)) return data.ideas;
    if (Array.isArray(data?.items)) return data.items;
    if (Array.isArray(data?.results)) return data.results;

    // Gemini REST-style response
    const geminiText = data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("\n");
    if (geminiText) {
      const parsed = unwrapBody(geminiText);
      if (Array.isArray(parsed)) return parsed;
      if (Array.isArray(parsed?.ideas)) return parsed.ideas;
    }

    // Common Lambda wrapper
    if (typeof data?.text === "string") {
      const parsed = unwrapBody(data.text);
      if (Array.isArray(parsed)) return parsed;
    }

    throw new Error("I got a response, but couldn't find the JSON idea array. Open 'Last request / response' to see what your Lambda returned.");
  }
  function extractXml(payload) {
    if (typeof payload === "string") return payload;
    const data = unwrapBody(payload);
    if (typeof data === "string") return data;
    if (typeof data?.xml === "string") return data.xml;
    if (typeof data?.feed === "string") return data.feed;
    if (typeof data?.body === "string") return data.body;
    throw new Error("Lambda feed proxy did not return XML. Expected raw XML or {xml:'...'}.");
  }
  function briefMarkdown(raw) {
    const x = card(raw), p = x.plan;
    const L = [
      `# ${(p && p.names && p.names[0]) || x.name}${p && p.tagline ? ` — ${p.tagline}` : ""}`, "",
      `**${x.verdict}** · stack fit ${x.stack_fit}/100 · ${x.price || "no price yet"}`,
      `**Why:** ${x.reason}`, "",
      `**The idea:** ${x.idea}`,
      `**Buyer:** ${x.buyer}`,
      `**Pain:** ${x.pain}`,
      `**Hard part:** ${x.hard_part}`,
      `**Search (Gemini's guess):** ${x.keywords.map(k => `${k.keyword} (${k.demand})`).join(" · ")}`,
      `**Source:** ${x.name}${x._source ? ` · ${x._source}` : ""}${x.source_url ? ` · ${x.source_url}` : ""}`
    ];
    if (p) {
      const m = p.monetization || {}, b = p.build || {};
      L.push("", "## Plan");
      if ((p.names || []).length) L.push(`**Names:** ${p.names.join(" / ")} (domains not checked)`);
      if (p.nugget) L.push(`**Nugget:** ${p.nugget}`);
      L.push(`**Money:** ${[m.model, m.price].filter(Boolean).join(" · ")}${m.how ? ` — ${m.how}` : ""}`);
      if (m.first_customers) L.push(`**First 10 customers:** ${m.first_customers}`);
      if ((p.keywords || []).length) L.push("", "### Keywords (verify in Google Trends)", ...p.keywords.map(k => `- ${k.keyword} — ${k.demand}, ${k.intent}${k.why ? ` (${k.why})` : ""}`));
      if (p.seo_angle) L.push(`- SEO angle: ${p.seo_angle}`);
      L.push("", "### Build", `- ${b.input || "?"} → ${b.output || "?"}`, `- Lambda: ${b.lambda || "None needed"}`);
      if ((b.files || []).length) L.push(`- Files: ${b.files.join(", ")}`);
      if ((p.weekend_plan || []).length) L.push("", "### Weekend plan", ...p.weekend_plan.map(st => `- [ ] ${st.when ? `**${st.when}:** ` : ""}${st.task}`));
    }
    return L.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
  }
  /* ---------- Decision cards (older saved briefs are mapped into the same shape) ---------- */
  const cleanName = n => String(n || "").split(/\s+[–—]\s+/)[0].slice(0, 60);
  function card(x) {
    const m = x.monetization || {};
    const legacyPlan = !x.plan && (x.weekend_plan || x.names) ? { names: x.names || [], tagline: x.tagline || "", nugget: x.nugget || "", monetization: m, keywords: x.keywords || [], seo_angle: x.seo_angle || "", build: x.build || {}, weekend_plan: x.weekend_plan || [] } : null;
    return { ...x,
      idea: x.idea || x.alternative || "", buyer: x.buyer || x.target_demo || "", pain: x.pain || x.why_they_pay || "",
      price: x.price || m.price || "", reason: x.reason || x.skip_reason || "", hard_part: x.hard_part || "",
      keywords: (x.keywords || []).slice(0, 2), plan: x.plan || legacyPlan,
      app_name: x.app_name || (x.plan && x.plan.names && x.plan.names[0]) || (x.names && x.names[0]) || "", from: cleanName(x.name) };
  }

  /* ---------- Feeds: one parser for Atom and RSS, plus each source's quirks ---------- */
  // Block tags become spaces first, so neighbouring paragraphs don't run together ("xPoints: 12").
  const textOf = html => { const d = document.createElement("div"); d.innerHTML = String(html || "").replace(/<\/(p|div|li|h[1-6]|blockquote|pre|tr)>|<br\s*\/?>|<hr\s*\/?>/gi, " $&"); return (d.textContent || "").replace(/\s+/g, " ").trim(); };
  function parseEntries(xmlText) {
    const xml = new DOMParser().parseFromString(xmlText, "application/xml");
    if (xml.querySelector("parsererror")) throw new Error("not valid XML");
    const atom = [...xml.querySelectorAll("entry")];
    if (atom.length) return atom.map(e => {
      const link = [...e.querySelectorAll("link")].find(l => !l.getAttribute("rel") || l.getAttribute("rel") === "alternate") || e.querySelector("link");
      return { title: e.querySelector("title")?.textContent?.trim() || "", html: e.querySelector("content")?.textContent || e.querySelector("summary")?.textContent || "",
        url: link?.getAttribute("href") || "", date: e.querySelector("published")?.textContent || e.querySelector("updated")?.textContent || "",
        category: e.querySelector("category")?.getAttribute("label") || "" };
    });
    return [...xml.querySelectorAll("item")].map(i => ({ title: i.querySelector("title")?.textContent?.trim() || "", html: i.querySelector("description")?.textContent || "",
      url: i.querySelector("link")?.textContent?.trim() || "", date: i.querySelector("pubDate")?.textContent || "", category: "" }));
  }
  function toItem(e, src) {
    let name = e.title, text = textOf(e.html), source = src.label;
    if (src.id === "showhn") {
      name = name.replace(/^Show HN:\s*/i, "");
      text = text.replace(/Article URL:\s*\S+/gi, "").replace(/Comments URL:\s*\S+/gi, "").replace(/Points:\s*\d+/gi, "").replace(/# Comments:\s*\d+/gi, "").trim();
      const m = name.match(/^(.{2,60}?)\s+[–—-]\s+(.+)$/);
      if (m) { name = m[1]; text = (m[2] + (text ? ". " + text : "")).trim(); }
    } else if (src.reddit) {
      text = text.replace(/submitted by\s+\/u\/\S+.*$/i, "").replace(/\[link\]|\[comments\]/gi, "").trim();
      if (e.category) source = e.category.startsWith("r/") ? e.category : "r/" + e.category;
    } else {
      const t = name.match(/^(.{2,60}?)\s+[–—]\s+(.+)$/);       // "QRBliss – Create brand-matched…" → name + tagline
      if (t && !src.reddit) { name = t[1]; text = (t[2] + (text ? ". " + text : "")).trim(); }
    }
    if (src.id === "producthunt") {
      text = text.replace(/Discussion\s*\|\s*Link\s*$/i, "").trim();
    }
    return { name: name.slice(0, 160), description: text.slice(0, 1500), source_url: e.url, date: e.date, kind: src.kind, source, sourceId: src.id };
  }
  const nameKey = n => String(n || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

  /* ---------- Status with honest progress ---------- */
  let timer = null;
  function setStatus(message, type = "", busy = false, progress = null) {
    clearInterval(timer);
    const el = $("status");
    el.className = "status show" + (type ? " " + type : "");
    el.innerHTML = `${busy ? '<span class="spin" aria-hidden="true"></span>' : ""}<span>${escapeHtml(message)}</span>${progress != null ? `<span class="progress" aria-hidden="true"><i style="width:${Math.round(progress * 100)}%"></i></span>` : ""}${busy ? '<span class="status__time" id="elapsed">0:00</span>' : ""}`;
    if (busy) {
      const t0 = setStatus.t0 || Date.now();
      setStatus.t0 = t0;
      const tick = () => { const s = Math.round((Date.now() - t0) / 1000), e = $("elapsed"); if (e) e.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
      tick(); timer = setInterval(tick, 1000);
    } else setStatus.t0 = null;
  }
  function clearStatus() { clearInterval(timer); setStatus.t0 = null; const el = $("status"); el.className = "status"; el.innerHTML = ""; }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1400); }

  /* ---------- Sources panel ---------- */
  function renderSources() {
    const on = new Set(enabled().map(s => s.id));
    const daysLeft = Math.ceil((REDDIT_END - Date.now()) / 864e5);
    const redditOn = SOURCES.some(s => s.reddit && on.has(s.id));
    $("srcCount").textContent = `${on.size} sources`;
    const groups = ["Launches", "Pain points", "Ideas"];
    $("sourcesList").innerHTML = groups.map(g => `<div><h3>${g}</h3>${SOURCES.filter(s => s.group === g).map(s => `
      <label class="src"><input type="checkbox" data-src="${s.id}" ${on.has(s.id) ? "checked" : ""}><strong>${escapeHtml(s.label)}</strong>${s.hint ? `<span>${escapeHtml(s.hint)}</span>` : ""}</label>`).join("")}</div>`).join("")
      + (redditOn ? `<p class="reddit-note">${daysLeft > 0 ? `Reddit ends public RSS on Nov 13: <strong>${daysLeft} day${daysLeft === 1 ? "" : "s"} left</strong>. The other sources keep working after that.` : `Reddit RSS has ended. Untick the Reddit sources.`}</p>` : "");
    $("sourcesList").querySelectorAll("[data-src]").forEach(cb => cb.addEventListener("change", () => {
      store.set(KEYS.sources, [...$("sourcesList").querySelectorAll("[data-src]:checked")].map(x => x.dataset.src));
      renderSources();
    }));
  }
  $("sourcesBtn").addEventListener("click", () => {
    const p = $("sourcesPanel"), open = p.hidden;
    p.hidden = !open; $("sourcesBtn").setAttribute("aria-expanded", String(open));
    if (!open && state.items.length) refreshFeed();      // closing the panel refreshes with the new selection
  });

  /* ---------- Inbox ---------- */
  function renderLaunches() {
    renderStepper();
    const root = $("launches");
    const carded = cardedKeys(), passed = passedMap();
    const ranked = state.items.some(x => rankOf(x));
    const visible = state.items.filter(x => {
      const r = rankOf(x), k = launchKey(x);
      if (state.filter === "passed") return !!passed[k];
      if (passed[k]) return false;
      if (state.filter === "top") return r && r.score >= 7;
      if (["launch", "pain", "idea"].includes(state.filter)) return x.kind === state.filter;
      return true;
    }).sort((a, b) => ((rankOf(b) || { score: -1 }).score - (rankOf(a) || { score: -1 }).score));
    const fresh = state.items.filter(x => state.newKeys.has(launchKey(x))).length;
    const bySrc = new Set(state.items.map(x => x.sourceId)).size;
    $("launchCount").textContent = state.items.length ? `${state.items.length} posts from ${bySrc} source${bySrc === 1 ? "" : "s"}${fresh ? ` · ${fresh} new in the last day` : ""}${ranked ? " · ranked by Gemini" : ""}` : "Nothing loaded";
    $("analyzeBtn").disabled = state.items.length === 0;
    const count = f => state.items.filter(x => { const r = rankOf(x), k = launchKey(x); if (f === "passed") return !!passed[k]; if (passed[k]) return false; if (f === "top") return r && r.score >= 7; if (f === "all") return true; return x.kind === f; }).length;
    const F = [["all", "All"], ["top", "Top (7+)"], ["pain", "Pain points"], ["idea", "Ideas"], ["launch", "Launches"], ["passed", "Passed"]];
    const show = state.inboxAll ? visible : visible.slice(0, 50);
    root.innerHTML = `<div class="filters">${F.map(([k, l]) => `<button type="button" class="fchip${state.filter === k ? " on" : ""}" data-filter="${k}">${l} <span>${count(k)}</span></button>`).join("")}</div>`
      + (show.length ? show.map(x => {
        const r = rankOf(x), k = launchKey(x), isCarded = carded.has(k), isPas = !!passed[k];
        return `<div class="ll${r && r.score < 4 ? " ll--low" : ""}">
          <div class="score ${r ? (r.score >= 7 ? "s-hi" : r.score >= 4 ? "s-mid" : "s-lo") : "s-none"}" title="Gemini's score (0-10)">${r ? r.score : "–"}</div>
          <div class="ll__main">
            ${r && r.angle ? `<p class="angle">${escapeHtml(r.angle)}</p>` : ""}
            <p class="ll__title"><strong>${escapeHtml(x.name)}</strong>${state.newKeys.has(k) ? ' <span class="pill new">NEW</span>' : ""}</p>
            <p class="ll__text">${escapeHtml(x.description.slice(0, 200))}${x.description.length > 200 ? "…" : ""}</p>
            <div class="meta2">${kindChip(x.kind)}<span class="chip">${escapeHtml(x.source)}</span></div>
          </div>
          <div class="ll__actions">
            ${isPas ? `<button class="btn btn--sm" type="button" data-unpass-item="${escapeHtml(k)}">Restore</button>`
              : isCarded ? `<span class="chip chip--planned">CARDED</span>` : `<button class="btn btn--sm btn--primary" type="button" data-card-item="${escapeHtml(k)}">Card it</button>`}
            ${isPas ? "" : `<button class="btn btn--sm btn--pass" type="button" data-pass-item="${escapeHtml(k)}">Pass</button>`}
            ${x.source_url ? `<a class="btn btn--sm btn--quiet" href="${escapeHtml(normalizeUrl(x.source_url))}" target="_blank" rel="noopener" aria-label="Open ${escapeHtml(x.name)}">${icon("ext")}</a>` : ""}
          </div>
        </div>`; }).join("") : `<p class="note" style="padding:16px">Nothing here.</p>`)
      + (visible.length > show.length ? `<button class="more" id="inboxMore" type="button">Show all ${visible.length}</button>` : "");
    const byKey = k => state.items.find(x => launchKey(x) === k);
    root.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { state.filter = b.dataset.filter; state.inboxAll = false; renderLaunches(); }));
    root.querySelectorAll("[data-card-item]").forEach(b => b.addEventListener("click", () => { const x = byKey(b.dataset.cardItem); if (x) cardItems([{ item: x, why: (rankOf(x) || {}).angle || "" }]); }));
    root.querySelectorAll("[data-pass-item]").forEach(b => b.addEventListener("click", () => { const x = byKey(b.dataset.passItem); if (x) { setPassed(x, true); toast("Passed. It won't come back."); renderLaunches(); renderIdeas(); } }));
    root.querySelectorAll("[data-unpass-item]").forEach(b => b.addEventListener("click", () => { const x = byKey(b.dataset.unpassItem); if (x) { setPassed(x, false); toast("Restored"); renderLaunches(); renderIdeas(); } }));
    const more = $("inboxMore");
    if (more) more.addEventListener("click", () => { state.inboxAll = true; renderLaunches(); });
  }

  /* ---------- This run: top pick + patterns ---------- */
  function pickTop(ideas) {
    const dem = { high: 10, medium: 5, low: 0 };
    const score = x => (Number(x.stack_fit) || 0) + Math.max(0, ...(card(x).keywords || []).map(k => dem[lvl(k.demand)])) + (card(x).price ? 3 : 0);
    const best = ideas.filter(x => x.verdict === "BUILD").sort((a, b) => score(b) - score(a))[0];
    return best ? { name: best.name, why: best._why || card(best).reason || "" } : null;
  }
  function renderInsights() {
    const root = $("insights");
    const pats = state.patterns || [], pick = state.topPick;
    if (!pats.length && !pick) { root.hidden = true; root.innerHTML = ""; return; }
    const pickIdea = pick ? state.ideas.find(i => i.name === pick.name) : null;
    root.hidden = false;
    root.className = "insights";
    root.innerHTML = `
      ${pick && pickIdea ? `<div class="panel panel--pick">
        <span class="eyebrow">Build this week</span>
        <span class="pick__name">${escapeHtml(card(pickIdea).app_name || card(pickIdea).from)}</span>
        <p class="pick__from">inspired by ${escapeHtml(card(pickIdea).from)} · ${escapeHtml(pickIdea._source || "")}</p>
        <p class="pick__idea">${escapeHtml(card(pickIdea).idea)}</p>
        <p class="pick__why">${escapeHtml(pick.why || "")}</p>
        <button class="btn btn--sm" type="button" id="jumpPick">${card(pickIdea).plan ? "Open the plan" : "Open the card"}</button>
      </div>` : ""}
      <div class="panel">
        <span class="eyebrow">Patterns across ${state.meta ? state.meta.considered + " posts" : "this run"}</span>
        ${pats.length ? `<ul class="pats">${pats.map(p => `<li>
            <div class="pats__top"><strong>${escapeHtml(p.problem)}</strong>${p.recurring ? ` <span class="pill v-maybe" title="${escapeHtml(p.matches_past ? "Matches: " + p.matches_past : "Seen in an earlier run")}">RECURRING</span>` : ""}</div>
            ${p.launches && p.launches.length ? `<span class="pats__who">${p.launches.slice(0, 6).map(escapeHtml).join(" · ")}${p.launches.length > 6 ? ` +${p.launches.length - 6} more` : ""}</span>` : ""}
            ${p.why_it_matters ? `<span class="pats__why">${escapeHtml(p.why_it_matters)}</span>` : ""}
          </li>`).join("")}</ul>` : `<p class="note">No problem showed up more than once this run.</p>`}
        ${recurringSummary()}
      </div>`;
    const j = $("jumpPick");
    if (j) j.addEventListener("click", () => { setTab("best"); const el = document.querySelector(`[data-name="${CSS.escape(pick.name)}"]`); if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "start" }); } });
  }
  function recurringSummary() {
    const runs = new Map();
    store.get(KEYS.patterns, []).forEach(p => { const k = p.problem.toLowerCase(); const r = runs.get(k) || { problem: p.problem, days: new Set() }; r.days.add(String(p.date).slice(0, 10)); runs.set(k, r); });
    const repeat = [...runs.values()].filter(r => r.days.size > 1).sort((a, b) => b.days.size - a.days.size).slice(0, 5);
    return repeat.length ? `<p class="memory"><span class="eyebrow">Keeps coming back</span><br>${repeat.map(r => `${escapeHtml(r.problem)} <span class="note">(${r.days.size} runs)</span>`).join(" · ")}</p>` : "";
  }
  function rememberPatterns(pats, at) {
    const hist = store.get(KEYS.patterns, []);
    pats.forEach(p => hist.unshift({ problem: (p.recurring && p.matches_past) ? p.matches_past : p.problem, date: at }));
    store.set(KEYS.patterns, hist.slice(0, 300));
  }

  /* ---------- Step guide ---------- */
  let loading = false;
  function renderStepper() {
    const items = state.items.length, ideas = state.ideas.length;
    const planned = state.ideas.filter(i => card(i).plan);
    const fromOld = ideas && state.analyzedAt && new Date(state.analyzedAt).toDateString() !== new Date().toDateString();
    let step, msg, cta = null;
    if (loading) { step = 1; msg = "Collecting fresh posts from your sources…"; }
    else if (!items && !ideas) { step = 1; msg = "No posts yet. Check Settings for your sources, then Refresh."; cta = ["Refresh", "refresh"]; }
    else if (!ideas || fromOld) { step = 2; msg = `${items} posts ready${fromOld ? " (your cards below are from " + fmtDate(state.analyzedAt) + ")" : ""}. Sift them for the ${$("briefCount").value} best weekend builds.`; cta = ["Find weekend builds", "analyze"]; }
    else if (!planned.length) { step = 3; const more = uncarded().length; msg = `Read the cards; Pass the duds. ${more ? `${more} more good posts are ranked below in All posts. ` : ""}When one feels right, hit Plan this build.`; cta = state.topPick ? ["Open the top pick", "pick"] : null; }
    else { step = 4; const p = card(planned[0]); msg = `Plan ready for ${p.app_name || p.from}. Copy the brief and build it this weekend.`; cta = ["Open the plan", "plan"]; }
    const names = ["Collect", "Sift", "Decide", "Plan"];
    $("stepper").innerHTML = `<ol>${names.map((n, i) => `<li class="${i + 1 < step ? "done" : i + 1 === step ? "now" : ""}"><span>${i + 1}</span>${n}</li>`).join("")}</ol>
      <p>${escapeHtml(msg)}</p>${cta ? `<button class="btn btn--sm ${cta[1] === "analyze" ? "btn--primary" : ""}" type="button" id="stepCta" data-go="${cta[1]}">${escapeHtml(cta[0])}</button>` : ""}`;
    const b = $("stepCta");
    if (b) b.addEventListener("click", () => {
      const go = b.dataset.go;
      if (go === "refresh") refreshFeed();

      else {
        const target = go === "plan" ? planned[0] : state.ideas.find(i => state.topPick && i.name === state.topPick.name);
        if (!target) return;
        setTab("best");

  /* ---------- Ranking (every post) and passing ---------- */
  const rankOf = x => store.get(KEYS.rank, {})[launchKey(x)] || null;
  const passedMap = () => store.get(KEYS.passed, {});
  const isPassed = x => !!passedMap()[launchKey(x)];
  function setPassed(x, on) {
    const m = passedMap(), k = launchKey(x);
    if (on) m[k] = new Date().toISOString(); else delete m[k];
    store.set(KEYS.passed, Object.fromEntries(Object.entries(m).slice(-3000)));
  }
  const cardedKeys = () => new Set(state.ideas.map(launchKey));
  // Posts not yet carded or passed, best score first
  function uncarded() {
    const carded = cardedKeys();
    return state.items.filter(x => !carded.has(launchKey(x)) && !isPassed(x) && rankOf(x) && rankOf(x).score >= 4)
      .sort((a, b) => rankOf(b).score - rankOf(a).score);
  }

  /* ---------- Saved ---------- */
  const savedKey = x => launchKey(x) + "|" + (card(x).idea || "").toLowerCase().slice(0, 80);
  const savedList = () => store.get(KEYS.shortlist, []);
  const isSaved = x => savedList().some(s => s.key === savedKey(x));
  function toggleSaved(x) {
    const list = savedList(), k = savedKey(x), i = list.findIndex(s => s.key === k);
    if (i >= 0) list.splice(i, 1); else list.unshift({ key: k, savedAt: new Date().toISOString(), brief: x });
    store.set(KEYS.shortlist, list);

  }

  /* ---------- Brief rows ---------- */
  const ORDER = { BUILD: 0, MAYBE: 1, SKIP: 2 };
  function rowsFor(tab) {
    if (tab === "saved") return savedList().map(s => ({ ...s.brief, _savedAt: s.savedAt }));
    const sorted = state.ideas.slice().sort((a, b) => (ORDER[a.verdict] ?? 1) - (ORDER[b.verdict] ?? 1) || (b.stack_fit || 0) - (a.stack_fit || 0));
    return tab === "passed" ? sorted.filter(x => x.verdict === "SKIP" || isPassed(x)) : sorted.filter(x => x.verdict !== "SKIP" && !isPassed(x));
  }
  function renderIdeas() {
    renderStepper();

    const rows = rowsFor(state.tab);

    root.innerHTML = rows.map((x, i) => row(x, state.tab === "best" && x.name === pickName, i)).join("") + (state.tab === "best" ? moreCardsHtml() : "");
    wireMore();
    root.querySelectorAll("[data-pass]").forEach(b => b.addEventListener("click", e => {

    root.querySelectorAll("[data-save]").forEach(b => b.addEventListener("click", e => {
      e.preventDefault();

    }));
    root.querySelectorAll("[data-plan]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); planIdea(rows[Number(b.dataset.plan)], b); }));
    root.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async e => {
      e.preventDefault();
      try { await navigator.clipboard.writeText(briefMarkdown(rows[Number(b.dataset.copy)])); } catch { toast("Couldn't copy"); return; }
      const html = b.innerHTML; b.innerHTML = `${icon("check")} Copied`; setTimeout(() => (b.innerHTML = html), 1300);
    }));
  }
  function row(raw, open, idx) {
    const x = card(raw), v = (x.verdict || "MAYBE").toUpperCase();
    const fit = Math.max(0, Math.min(100, Number(x.stack_fit) || 0));
    const rank = { high: 0, medium: 1, low: 2 };
    const top = x.keywords.slice().sort((a, c) => rank[lvl(a.demand)] - rank[lvl(c.demand)])[0];
    const isNew = state.newKeys.has(launchKey(x));
    const title = x.app_name || x.from;
    return `<details class="row row--${v.toLowerCase()}" data-name="${escapeHtml(x.name)}" ${open ? "open" : ""}>
      <summary>

        <div class="cell-main">
          <div class="names"><strong>${escapeHtml(title)}</strong>${x.plan ? '<span class="chip chip--planned">PLANNED</span>' : ""}${isNew ? '<span class="pill new">NEW</span>' : ""}</div>
          <div class="inspired">${kindChip(x._kind)} inspired by <b>${escapeHtml(x.from)}</b> · ${escapeHtml(x._source || "")}${x._savedAt ? ` · saved ${escapeHtml(fmtDate(x._savedAt))}` : ""}</div>
          <p class="alt">${escapeHtml(v === "SKIP" ? (x.reason || x.idea) : x.idea)}</p>
        </div>

        <div class="cell-demand">${top ? `<span class="cell-label">Top search</span><span class="pill lvl-${lvl(top.demand)}">${escapeHtml(lvl(top.demand).toUpperCase())}</span>` : ""}</div>
        <div class="fit" title="Stack fit">${fit}<span class="fit__bar"><i style="width:${fit}%"></i></span></div>
        ${state.tab === "saved" ? "<span></span>" : `<button class="btn btn--sm btn--pass" type="button" data-pass="${idx}" title="${isPassed(x) ? "Bring it back" : "Not for me: hide it and never show it again"}">${isPassed(x) ? "Restore" : "Pass"}</button>`}
        ${icon("chev", "chev")}
      </summary>
      <div class="detail">
        <div class="tile tile--wide tile--reason v-${v.toLowerCase()}"><h3>Verdict</h3><p>${escapeHtml(x.reason || v)}</p></div>
        <div class="tile tile--wide"><h3>The idea</h3><p>${escapeHtml(x.idea || "—")}</p></div>
        <div class="tile"><h3>Buyer</h3><p>${escapeHtml(x.buyer || "—")}</p><p class="note">Pays because: ${escapeHtml(x.pain || "—")}</p></div>
        <div class="tile"><h3>Demand (Gemini's guess)</h3>${x.keywords.length ? `<ul class="kwl">${x.keywords.map(k => `<li><span class="k">${escapeHtml(k.keyword)}</span><span class="pill lvl-${lvl(k.demand)}">${escapeHtml(lvl(k.demand).toUpperCase())}</span><a href="https://trends.google.com/trends/explore?q=${encodeURIComponent(k.keyword)}" target="_blank" rel="noopener" title="Google Trends">${icon("trend")}</a><a href="https://www.google.com/search?q=${encodeURIComponent(k.keyword)}" target="_blank" rel="noopener" title="Search Google">${icon("search")}</a></li>`).join("")}</ul>` : "<p>—</p>"}</div>
        <div class="tile"><h3>Hard part</h3><p>${escapeHtml(x.hard_part || "—")}</p><h3 style="margin-top:10px">Price</h3><p class="big">${escapeHtml(x.price || "—")}</p></div>
        <p class="src-line">From \u201c${escapeHtml(x.name)}\u201d · ${escapeHtml(KIND_LABEL[x._kind] || "Launch")} · ${escapeHtml(x._source || "")}${x._why ? ` · picked because ${escapeHtml(x._why)}` : ""}</p>
        ${x.plan ? planHtml(x.plan) : ""}
        <div class="actions">
          ${v === "SKIP" ? "" : `<button class="btn btn--sm btn--plan" type="button" data-plan="${idx}">${x.plan ? "Re-plan this build" : "Plan this build"}</button>`}
          <button class="btn btn--sm btn--quiet${isSaved(x) ? " is-on" : ""}" type="button" data-save="${idx}">${icon("star")}${isSaved(x) ? " Saved" : " Save"}</button>
          <button class="btn btn--sm btn--quiet" type="button" data-copy="${idx}">${icon("copy")} Copy brief</button>
          ${x.source_url ? `<a class="btn btn--sm btn--quiet" href="${escapeHtml(normalizeUrl(x.source_url))}" target="_blank" rel="noopener">${icon("ext")} Original</a>` : ""}
        </div>
      </div>
    </details>`;
  }

  function planHtml(p) {
    const m = p.monetization || {}, b = p.build || {};
    return `<div class="planbox">
      <h3>Weekend plan</h3>
      <div>
        ${(p.names || []).length ? `<div class="namechips">${p.names.map(n => `<span>${escapeHtml(n)}</span>`).join("")}</div><p class="note">Name ideas. Domains not checked.</p>` : ""}
        ${p.tagline ? `<p class="tagline">\u201c${escapeHtml(p.tagline)}\u201d</p>` : ""}
        ${p.nugget ? `<p style="margin-top:8px">${escapeHtml(p.nugget)}</p>` : ""}
      </div>
      <dl class="kv">
        <dt>Money</dt><dd>${escapeHtml([m.model, m.price].filter(Boolean).join(" · ") || "—")}</dd>
        ${m.how ? `<dt>How</dt><dd>${escapeHtml(m.how)}</dd>` : ""}
        ${m.first_customers ? `<dt>First 10</dt><dd>${escapeHtml(m.first_customers)}</dd>` : ""}
        <dt>Build</dt><dd>${escapeHtml(b.input || "?")} \u2192 ${escapeHtml(b.output || "?")}</dd>

      </dl>
      ${(p.keywords || []).length ? `<div><table class="kw"><tbody>${p.keywords.map(k => `<tr>
        <td class="kw__t" title="${escapeHtml(k.why || "")}">${escapeHtml(k.keyword)}</td>
        <td><span class="pill lvl-${lvl(k.demand)}">${escapeHtml(lvl(k.demand).toUpperCase())}</span></td>
        <td class="kw__i">${escapeHtml(k.intent || "")}</td>
        <td class="kw__l"><a href="https://trends.google.com/trends/explore?q=${encodeURIComponent(k.keyword)}" target="_blank" rel="noopener" title="Google Trends">${icon("trend")}</a><a href="https://www.google.com/search?q=${encodeURIComponent(k.keyword)}" target="_blank" rel="noopener" title="Search Google">${icon("search")}</a></td>
      </tr>`).join("")}</tbody></table>${p.seo_angle ? `<p class="note">SEO angle: ${escapeHtml(p.seo_angle)}</p>` : ""}</div>` : "<div></div>"}
      ${(p.weekend_plan || []).length ? `<ol class="steps">${p.weekend_plan.map(st => `<li><span class="when">${escapeHtml(st.when || "Step")}</span><span>${escapeHtml(st.task)}</span></li>`).join("")}</ol>` : ""}
    </div>`;
  }
  /* ---------- Plan this build: the full weekend plan for one card ---------- */
  async function planIdea(raw, btn) {
    const x = card(raw);
    const t0 = Date.now();
    btn.disabled = true;
    const tick = () => { btn.textContent = `Planning… ${Math.round((Date.now() - t0) / 1000)}s`; };
    tick(); const iv = setInterval(tick, 1000);
    try {
      const res = await postJson(API_URL, { action: "plan",
        item: { name: x.name, description: x._desc || x.idea || x.name, source_url: x.source_url, kind: x._kind || "launch", source: x._source || "" },
        decision: { app_name: x.app_name, idea: x.idea, buyer: x.buyer, pain: x.pain, price: x.price, hard_part: x.hard_part, keywords: x.keywords } });
      // Keep the plan on the run's card and on its saved copy, so it survives reloads
      const key = savedKey(raw);
      const live = state.ideas.find(i => savedKey(i) === key);
      if (live) live.plan = res.plan;
      raw.plan = res.plan;
      if (state.analyzedAt) store.set(KEYS.last, { at: state.analyzedAt, ideas: state.ideas, patterns: state.patterns, topPick: state.topPick, meta: state.meta });
      const saved = savedList(), hit = saved.find(sv => sv.key === key);
      if (hit) { hit.brief = { ...hit.brief, plan: res.plan }; store.set(KEYS.shortlist, saved); }
      renderInsights(); renderIdeas();
      const el = document.querySelector(`[data-name="${CSS.escape(x.name)}"]`);
      if (el) { el.open = true; el.querySelector(".planbox")?.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
      toast("Plan ready");
    } catch (err) {
      clearInterval(iv); btn.disabled = false; btn.textContent = "Plan this build";
      toast(friendly(err).slice(0, 90));
      return;
    }
    clearInterval(iv);
  }

  function moreCardsHtml() {
    const left = uncarded();
    if (!state.analyzedAt || !left.length) return "";
    const n = Math.min(Number($("briefCount").value), left.length);
    return `<div class="more-cards"><button class="btn btn--primary" type="button" id="moreCards" ${state.carding ? "disabled" : ""}>Card the next ${n}</button>
      <span class="note">${left.length} more post${left.length === 1 ? "" : "s"} scored 4+ · or browse All posts below and card any of them</span></div>`;
  }
  function wireMore() {
    const b = $("moreCards");
    if (b) b.addEventListener("click", () => {
      const n = Number($("briefCount").value);
      cardItems(uncarded().slice(0, n).map(x => ({ item: x, why: (rankOf(x) || {}).angle || "" })));
    });
  }

  function setTab(t) {
    state.tab = t;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    renderIdeas();
  }
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

  /* ---------- Network ---------- */
  async function postJson(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch { data = text; }
    if (!res.ok) { const e = new Error((data && data.error) || `The Lambda returned ${res.status}.`); e.status = res.status; throw e; }
    return data;
  }
  function friendly(err) {
    const msg = (err && err.message) || "Something went wrong.";
    return /Failed to fetch|NetworkError|Load failed/i.test(msg) ? "Couldn't reach the Lambda. Check the Function URL's CORS allows this page (use * while testing)." : msg;
  }
  async function pool(tasks, n) {                // run async tasks n at a time
    const results = []; let i = 0;
    await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, async () => { while (i < tasks.length) { const k = i++; results[k] = await tasks[k](); } }));
    return results;
  }

  /* ---------- Is the Lambda healthy? One check, one clear message ---------- */
  let healthy = false;
  async function checkLambda() {
    if (healthy) return null;
    let res, text = "";
    try { res = await fetch(API_URL.replace(/\/$/, "") + "/health", { cache: "no-store" }); text = await res.text(); }
    catch { return "Couldn't reach the Lambda at all. Most likely CORS: in the Function URL settings, set Allow origin to * and Allow headers to Content-Type."; }
    let data = null; try { data = JSON.parse(text); } catch { /* not JSON */ }
    if (data && data.service === "betalist-idea-sifter") { healthy = true; return null; }
    if (data && data.service === "checkaeo-scan") return "Your Lambda is still running the old Aeoden scanner code. Upload betalist-sifter-lambda.zip again (Code → Upload from → .zip file), then set Handler to index.handler.";
    if (res.status === 502 || /Internal Server Error/i.test(text)) return "The Lambda crashes before it can answer (HTTP 502). Almost always the handler setting: Runtime settings → Edit → Handler: index.handler, Runtime: Node.js 20.x or newer. The exact error is in CloudWatch Logs.";
    if (res.status === 403) return "The Function URL refused the request (HTTP 403). Check its Auth type is NONE.";
    return `The Lambda answered /health with HTTP ${res.status}: ${text.slice(0, 120)}`;
  }

  /* ---------- Refresh: every enabled source, in parallel ---------- */
  async function refreshFeed() {
    const srcs = enabled();
    if (!srcs.length) { setStatus("Pick at least one source.", "warn"); return; }
    const problem = await checkLambda();
    if (problem) { setStatus(problem, "error"); $("refreshBtn").disabled = false; loading = false; renderStepper(); return; }
    $("refreshBtn").disabled = true; $("analyzeBtn").disabled = true;
    loading = true; renderStepper();
    setStatus(`Fetching ${srcs.length} source${srcs.length === 1 ? "" : "s"}…`, "", true);
    const failed = [];
    const lists = await pool(srcs.map(src => async () => {
      try {
        const payload = await postJson(API_URL, { action: "fetch_feed", url: src.url });
        return parseEntries(extractXml(payload)).slice(0, Number($("perSource").value)).map(e => toItem(e, src)).filter(x => x.name);
      } catch (err) {
        const m = String(err.message || "").match(/HTTP (\d{3})/);
        failed.push(`${src.label}: ${m ? `blocked (HTTP ${m[1]})` : (err.message || "failed").slice(0, 60)}`);
        return [];
      }
    }), 4);
    // De-duplicate across sources by link, then by name
    const seenUrl = new Set(), seenName = new Set(), items = [];
    for (const x of lists.flat()) {
      const u = launchKey(x), n = nameKey(x.name);
      if ((u && seenUrl.has(u)) || (n && seenName.has(n))) continue;
      if (u) seenUrl.add(u); if (n) seenName.add(n); items.push(x);
    }
    state.items = items; state.failed = failed; state.inboxAll = false; loading = false;
    const seen = store.get(KEYS.seen, {}), now = new Date().toISOString();
    items.forEach(x => { const k = launchKey(x); if (k && !seen[k]) seen[k] = now; });
    const dayAgo = Date.now() - 864e5;
    state.newKeys = new Set(items.map(launchKey).filter(k => k && Date.parse(seen[k]) > dayAgo));
    store.set(KEYS.seen, Object.fromEntries(Object.entries(seen).sort((a, b) => b[1].localeCompare(a[1])).slice(0, 4000)));
    renderLaunches(); renderIdeas();
    if (!items.length) setStatus(failed.length ? `Nothing loaded. ${failed.join(" · ")}` : "The sources had no posts.", "error");
    else if (failed.length) setStatus(`Loaded ${items.length} posts. Couldn't load: ${failed.join(" · ")}${failed.some(f => /Reddit|r\//.test(f) && /403|429/.test(f)) ? ". Reddit often blocks cloud servers; the other sources still work." : ""}`, "warn");
    else clearStatus();
    $("refreshBtn").disabled = false;
    $("analyzeBtn").disabled = items.length === 0;
  }

  /* ---------- Find weekend builds: sift everything, then brief the best ---------- */
  /* ---------- Find weekend builds: rank every post, then card the best ---------- */
  async function analyze() {
    const all = state.items.filter(x => !isPassed(x));
    if (!all.length) { setStatus("Every post is passed. Refresh for new ones.", "warn"); return; }
    const keep = Number($("briefCount").value);
    $("analyzeBtn").disabled = true; $("refreshBtn").disabled = true;
    setStatus.t0 = null;
    try {
      setStatus(`Ranking ${all.length} posts…`, "", true);
      const history = [...new Set(store.get(KEYS.patterns, []).map(p => p.problem))].slice(0, 30);
      const tri = await postJson(API_URL, { action: "triage", keep, history,
        items: all.map((x, id) => ({ id, kind: x.kind, source: x.source, name: x.name, text: x.description.slice(0, 280) })) });
      // Remember every post's score and angle (survives reloads)
      const rank = store.get(KEYS.rank, {}), at = new Date().toISOString();
      (tri.ranked || []).forEach(r => { const x = all[r.id]; if (x) rank[launchKey(x)] = { score: r.score, angle: r.angle || "", at }; });
      store.set(KEYS.rank, Object.fromEntries(Object.entries(rank).sort((a, b) => String(b[1].at).localeCompare(String(a[1].at))).slice(0, 3000)));
      state.ideas = []; state.patterns = tri.patterns || []; state.topPick = null; state.analyzedAt = at;
      state.meta = { considered: tri.considered || all.length };
      setTab("best"); renderInsights(); renderLaunches();
      const picks = uncarded().slice(0, keep);
      if (!picks.length) { setStatus(`Ranked ${all.length} posts and nothing scored 4+. Browse All posts below, or refresh later.`, "warn"); return; }
      await cardItems(picks.map(x => ({ item: x, why: (rankOf(x) || {}).angle || "" })), true);
    } catch (err) {
      setStatus(friendly(err), "error");
    } finally {
      $("analyzeBtn").disabled = state.items.length === 0;
      $("refreshBtn").disabled = false;
    }
  }

  // Decision cards for any list of posts: first run, "Card the next N", or "Card it" on one post
  async function cardItems(chosen, fromSift = false) {
    if (!chosen.length || state.carding) return;
    state.carding = true; renderIdeas();
    if (!fromSift) setStatus.t0 = null;
    const batches = []; for (let i = 0; i < chosen.length; i += BATCH) batches.push(chosen.slice(i, i + BATCH));
    let done = 0, failed = 0;
    const reasons = [];
    const progress = () => setStatus(`Writing ${chosen.length} decision card${chosen.length === 1 ? "" : "s"} · ${done} of ${batches.length} batch${batches.length === 1 ? "" : "es"} done`, "", true, done / batches.length);
    progress();
    const sendBatch = batch => postJson(API_URL, { action: "analyze_betalist", briefs_only: true,
      items: batch.map(({ item }) => ({ name: item.name, description: item.description, source_url: item.source_url, date: item.date, kind: item.kind, source: item.source })) });
    const addIdeas = (batch, res) => {
      extractIdeas(res).forEach(idea => {
        const src = batch.find(b => b.item.name.toLowerCase() === String(idea.name || "").toLowerCase()) || (batch.length === 1 ? batch[0] : null);
        if (!src || state.ideas.some(x => launchKey(x) === launchKey(src.item))) return;
        state.ideas.push({ ...idea, name: src.item.name, _kind: src.item.kind, _source: src.item.source, _why: src.why || "", _desc: src.item.description.slice(0, 1500), source_url: src.item.source_url || idea.source_url || "" });
      });
      state.topPick = pickTop(state.ideas);
      renderInsights(); renderIdeas(); renderLaunches();
    };
    const missing = batch => batch.filter(b => !state.ideas.some(x => launchKey(x) === launchKey(b.item)));
    await pool(batches.map(batch => async () => {
      try { addIdeas(batch, await sendBatch(batch)); }
      catch (err) { reasons.push(err.message); }
      const left = missing(batch);
      if (left.length) {
        await new Promise(r => setTimeout(r, 1500));
        for (const one of left) {
          try { addIdeas([one], await sendBatch([one])); }
          catch (err) { reasons.push(err.message); failed++; }
        }
      }
      done++; progress();
    }), PARALLEL);
    state.carding = false;
    if (fromSift) rememberPatterns(state.patterns, state.analyzedAt);
    state.meta = { ...(state.meta || {}), picked: state.ideas.length };
    store.set(KEYS.last, { at: state.analyzedAt, ideas: state.ideas, patterns: state.patterns, topPick: state.topPick, meta: state.meta });
    renderIdeas(); renderLaunches();
    const builds = state.ideas.filter(x => x.verdict === "BUILD" && !isPassed(x)).length;
    const why = [...new Set(reasons.slice(-failed))].slice(0, 2).join(" / ");
    setStatus(`${state.ideas.length} cards · ${builds} worth building · ${uncarded().length} more posts scored 4+ to wade through${failed ? ` · ${failed} card${failed === 1 ? "" : "s"} failed after a retry${why ? ` (${why})` : ""}` : ""}.`, failed ? "warn" : "");
    if (!failed) setTimeout(() => { if ($("status").textContent.includes("worth building")) clearStatus(); }, 8000);
  }

  $("refreshBtn").addEventListener("click", refreshFeed);
  $("analyzeBtn").addEventListener("click", analyze);

  /* ---------- Start: restore the last run, then fetch fresh posts ---------- */
  const last = store.get(KEYS.last, null);
  if (last && Array.isArray(last.ideas)) {
    state.ideas = last.ideas; state.patterns = last.patterns || []; state.topPick = last.topPick || null; state.analyzedAt = last.at || null; state.meta = last.meta || null;
    $("launchBox").open = false;
  }
  const settings = store.get(KEYS.settings, {});
  for (const id of ["perSource", "briefCount"]) {
    const el = $(id);
    if (settings[id] && [...el.options].some(o => o.value === String(settings[id]))) el.value = String(settings[id]);
    el.addEventListener("change", () => { const cur = store.get(KEYS.settings, {}); cur[id] = el.value; store.set(KEYS.settings, cur); if (id === "perSource") refreshFeed(); else renderStepper(); });
  }
  renderSources(); renderInsights(); renderIdeas(); renderLaunches();
  refreshFeed();
})();
</script>
</body>
</html>
