version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p dist
        - find . -mindepth 1 -maxdepth 1 ! -name dist ! -name worker ! -name .git ! -name amplify.yml ! -name README.md ! -name DEPLOY.md -exec cp -R {} dist/ \;
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
