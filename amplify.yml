version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p dist
        - cp -R . dist/
        - rm -rf dist/worker
        - rm -rf dist/dist
        - rm -rf dist/.git
        - rm -f dist/amplify.yml
        - rm -f dist/README.md
        - rm -f dist/DEPLOY.md
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
